name: DNS replication scripts
on:
  pull_request:
    paths:
      - "dns-lab/**"
      - ".github/workflows/dns-replication.yml"
  push:
    branches: [main]
    paths:
      - "dns-lab/**"
      - ".github/workflows/dns-replication.yml"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s dns-lab -p 'test_*.py'
      - name: Syntax checks
        run: python3 -m py_compile dns-lab/scripts/bootstrap-secondaries.py dns-lab/scripts/assert-serials.py

name: DNS lab configuration
on:
  pull_request:
    paths:
      - "dns-lab/**"
      - ".github/workflows/dns-lab.yml"
  push:
    branches: [main]
    paths:
      - "dns-lab/**"
      - ".github/workflows/dns-lab.yml"
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        working-directory: dns-lab
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
